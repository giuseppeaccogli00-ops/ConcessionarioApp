services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-free
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PASSWORD: "Password123!"
      APP_USER: "app"
      APP_USER_PASSWORD: "AppPassword123!"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  oracle_data: